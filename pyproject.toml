[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-inference-bench"
version = "0.1.0"
description = "Latency/throughput benchmarking across local LLM inference backends."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
packages = ["inference_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
